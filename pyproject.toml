[project]
name = "icml26-repro-3wpdfjz1ut-care"
version = "0.1.0"
description = "Reproduction of CARE: Confounder-Aware Aggregation for Reliable LLM Evaluation (arXiv 2603.00039)"
requires-python = "==3.11.*"
dependencies = [
    "numpy>=1.26,<2.2",
    "pandas>=2.2,<2.3",
    "scipy>=1.13,<1.15",
    "scikit-learn>=1.5,<1.6",
    "cvxpy>=1.5,<1.6",
    "snorkel>=0.10.0,<0.11",
    "sympy>=1.13,<1.14",
    "mpmath>=1.3,<1.4",
    "tqdm>=4.66",
    "torch>=2.4,<2.6",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[tool.uv]
package = false
